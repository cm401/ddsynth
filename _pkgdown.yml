url: https://cm401.github.io/ddsynth/

template:
  bootstrap: 5

home:
  title: "ddsynth"
  description: "Delay Distributions from Summary Statistics"

navbar:
  structure:
    left:  [intro, articles, reference]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/cm401/ddsynth

articles:
  - title: "Getting Started"
    navbar: ~
    contents:
      - introduction
  - title: "Methods"
    navbar: ~
    contents:
      - data_synthesis_stan
      - simulation_study

reference:
  - title: "Data Synthesis"
    desc: "Functions for synthesising delay distribution data"
    contents:
      - starts_with("create_")
      - starts_with("generate_")
      - starts_with("prepare_")
      - extract_dataset_summary
      - filter_datasets
  - title: "Model Fitting"
    desc: "Functions for fitting hierarchical Bayesian models"
    contents:
      - starts_with("fit_")
      - starts_with("run_")
      - starts_with("bsl_")
      - make_stan_init_fn
      - pre_inference_checks
      - should_attempt_gg
      - update_phi_prior
  - title: "Results & Plotting"
    desc: "Functions for summarising and visualising results"
    contents:
      - starts_with("create_results")
      - starts_with("create_coverage")
      - starts_with("create_bias")
      - starts_with("create_mae")
      - starts_with("create_convergence")
      - compute_pathogen_model_bayes_factors
      - plot_main_figure
  - title: "Simulation Metrics"
    desc: "Functions for evaluating simulation study performance"
    contents:
      - check_coverage
      - compute_iqd
      - compute_median_bias
      - compute_predictive_cdf
      - compute_posterior_predictive_quantile_ci
      - compute_true_marginal_quantile
      - compute_wis
      - extract_quantiles
      - summarise_parameters
